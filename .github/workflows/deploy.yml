name: bl8 CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_UI: ghcr.io/${{ github.repository_owner }}/bl8-ui
  IMAGE_UI_MIGRATE: ghcr.io/${{ github.repository_owner }}/bl8-ui-migrate
  IMAGE_REDIRECT: ghcr.io/${{ github.repository_owner }}/bl8-redirect

jobs:
  # Runs on every push and PR — the build itself is a real validation that both images still
  # compile (ui/'s multi-stage `pnpm run build`, redirect/'s `go build`), same value this repo's
  # existing lint/test CI already provides for the rest of the code. Only a push to main also
  # pushes to ghcr.io and goes on to copy-k8s/deploy (see their own `if:` below) — a PR must
  # never publish a `:latest` (or any) tag, let alone deploy, from unreviewed/untrusted code.
  build-and-push:
    runs-on: ubuntu-latest
    # This repo's default GITHUB_TOKEN permissions are read-only (Settings > Actions > General),
    # so pushing a new image package to ghcr.io needs packages: write scoped explicitly here
    # rather than loosening that repo-wide default for every workflow.
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      # submodules: false here on purpose — actions/checkout's own submodule fetching always
      # configures a global http.https://github.com/.extraheader Authorization using this
      # workflow's own GITHUB_TOKEN (which has no access to bl8-ui/bl8-redirect, both private),
      # regardless of persist-credentials. That header applies to any https://github.com/ URL,
      # so it collides with — and wins over — any custom insteadOf-rewritten credentials for
      # the same host, breaking the submodule clone with a misleading "repository not found".
      # Checking out submodules ourselves in the next step, after this action is done touching
      # git config, avoids that collision entirely.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      # .gitmodules points ui/ and redirect/ at git@hserge.github.com:... — a personal SSH host
      # alias (for juggling multiple GitHub accounts locally) that does not exist as a real
      # hostname on this runner. Rewrite it to a plain HTTPS github.com URL authenticated with a
      # PAT, then fetch the submodules ourselves — see the comment on "Checkout code" above for
      # why this can't just be `submodules: recursive` on that step instead.
      - name: Check out submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/".insteadOf "git@hserge.github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build ui
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            --target prod \
            -t "${{ env.IMAGE_UI }}:${IMAGE_TAG}" \
            -t "${{ env.IMAGE_UI }}:latest" \
            ./ui

      - name: Build redirect
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t "${{ env.IMAGE_REDIRECT }}:${IMAGE_TAG}" \
            -t "${{ env.IMAGE_REDIRECT }}:latest" \
            ./redirect

      # ui/Dockerfile's `migrate` target: full (non-pruned) deps for drizzle-kit plus the
      # drizzle/ migration files, neither of which the prod image carries — run as a one-off
      # Job against the real DATABASE_URL before the deploy job rolls out bl8-ui, so a schema
      # change never ships in application code without the DB change that backs it (see the
      # deploy job's own migration step below for why this exists).
      - name: Build ui migrator
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            --target migrate \
            -t "${{ env.IMAGE_UI_MIGRATE }}:${IMAGE_TAG}" \
            ./ui

      - name: Push ui and redirect
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker push "${{ env.IMAGE_UI }}:${IMAGE_TAG}"
          docker push "${{ env.IMAGE_UI }}:latest"
          docker push "${{ env.IMAGE_UI_MIGRATE }}:${IMAGE_TAG}"
          docker push "${{ env.IMAGE_REDIRECT }}:${IMAGE_TAG}"
          docker push "${{ env.IMAGE_REDIRECT }}:latest"

  copy-k8s:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to remote server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.K8S_HOST }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_username: ${{ secrets.PROXY_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.PROXY_PORT }}
          source: ".k8s/*.yml"
          target: "~"

  deploy:
    needs: [build-and-push, copy-k8s]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to Kubernetes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.K8S_HOST }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_username: ${{ secrets.PROXY_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.PROXY_PORT }}
          script: |
            set -e
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            if [ -z "$IMAGE_TAG" ]; then
              echo "IMAGE_TAG is empty"
              exit 1
            fi

            mkdir -p ~/.kube || exit 1
            echo "${{ secrets.ENCODED_KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config || exit 1
            chmod 600 ~/.kube/config || exit 1
            export KUBECONFIG=~/.kube/config

            kubectl apply -f ~/.k8s/namespace.yml || exit 1

            # Pull secret for ghcr.io — the GITHUB_TOKEN used to push above is scoped to this
            # one workflow run and can't authenticate the cluster's own later image pulls, so
            # this needs a real, persistent PAT (repo secret GHCR_PULL_TOKEN, `read:packages`
            # scope) instead.
            kubectl create secret docker-registry ghcr-pull-secret \
              --namespace bl8 \
              --docker-server=ghcr.io \
              --docker-username="${{ github.repository_owner }}" \
              --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
              --dry-run=client -o yaml | kubectl apply -f - || exit 1

            # bl8-ui runtime secrets — see ui/README.md's "Environment variables" for what each
            # one is; UI_REDIS_URL already carries its password embedded (redis://:pass@host:port).
            # Paddle/Stripe values are currently sandbox/placeholder (BILLING_PROVIDER=paddle in
            # ui-configmap.yml is the one actually live) — swap for real credentials once they exist.
            kubectl create secret generic bl8-ui-secrets \
              --namespace bl8 \
              --from-literal=DATABASE_URL="${{ secrets.UI_DATABASE_URL }}" \
              --from-literal=REDIS_URL="${{ secrets.UI_REDIS_URL }}" \
              --from-literal=AUTH_SECRET="${{ secrets.UI_AUTH_SECRET }}" \
              --from-literal=GOOGLE_CLIENT_ID="${{ secrets.UI_GOOGLE_CLIENT_ID }}" \
              --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.UI_GOOGLE_CLIENT_SECRET }}" \
              --from-literal=PADDLE_API_KEY="${{ secrets.UI_PADDLE_API_KEY }}" \
              --from-literal=PADDLE_WEBHOOK_SECRET="${{ secrets.UI_PADDLE_WEBHOOK_SECRET }}" \
              --from-literal=STRIPE_SECRET_KEY="${{ secrets.UI_STRIPE_SECRET_KEY }}" \
              --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.UI_STRIPE_WEBHOOK_SECRET }}" \
              --dry-run=client -o yaml | kubectl apply -f - || exit 1

            # bl8-redirect runtime secrets — REDIS_ADDR is a bare host:port (not a URL), so its
            # password travels as its own var; see redirect/README.md's "Environment variables".
            kubectl create secret generic bl8-redirect-secrets \
              --namespace bl8 \
              --from-literal=DATABASE_URL="${{ secrets.REDIRECT_DATABASE_URL }}" \
              --from-literal=REDIS_ADDR="${{ secrets.REDIRECT_REDIS_ADDR }}" \
              --from-literal=REDIS_PASSWORD="${{ secrets.REDIRECT_REDIS_PASSWORD }}" \
              --dry-run=client -o yaml | kubectl apply -f - || exit 1

            # TLS: no manual cert/key secrets — cert-manager's existing letsencrypt-prod
            # ClusterIssuer issues and rotates bl8-ui-tls/bl8-redirect-tls itself, driven by the
            # annotations on ~/.k8s/ingress.yml (same pattern as this cluster's other ingresses).

            # Run pending database migrations before rolling out the new image. This pipeline
            # previously had none at all — a schema change could ship in application code with
            # no corresponding DB change, and the very first write against the stale table would
            # fail. That's not hypothetical: it's exactly how a real "Access Denied" on Google
            # sign-in turned out to trace back to auth.ts's signIn callback failing its
            # `INSERT INTO users` against a users table still missing the plan_id column that
            # migration 0004 added — @auth/core wraps any exception thrown there into a generic
            # "AccessDenied" and discards the real error (see that callback's own comment).
            #
            # Runs as a one-off Job using the migrate image's own drizzle/ folder + drizzle-kit
            # (both deliberately absent from the prod image) against the same bl8-ui-secrets
            # DATABASE_URL the app itself uses, which is why this needs to come after that
            # secret is created above. Jobs are immutable once created, so delete any previous
            # run under this fixed name first rather than letting a retry collide with it.
            kubectl delete job bl8-ui-migrate -n bl8 --ignore-not-found || exit 1
            cat <<JOBEOF | kubectl apply -f - || exit 1
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: bl8-ui-migrate
              namespace: bl8
            spec:
              backoffLimit: 0
              template:
                spec:
                  restartPolicy: Never
                  containers:
                    - name: migrate
                      image: ${{ env.IMAGE_UI_MIGRATE }}:${IMAGE_TAG}
                      envFrom:
                        - secretRef:
                            name: bl8-ui-secrets
            JOBEOF
            if ! kubectl wait --for=condition=complete job/bl8-ui-migrate -n bl8 --timeout=120s; then
              echo "Migration job failed or timed out — logs:"
              kubectl logs job/bl8-ui-migrate -n bl8 --tail=200
              exit 1
            fi
            echo "Database migrations applied"

            # ConfigMaps first (deployments read them via envFrom on pod start).
            kubectl apply -f ~/.k8s/ui-configmap.yml || exit 1
            kubectl apply -f ~/.k8s/redirect-configmap.yml || exit 1

            # Services can go in any order relative to deployments — DNS/endpoints just won't
            # resolve to anything until the deployment's pods are actually ready.
            kubectl apply -f ~/.k8s/ui-service.yml || exit 1
            kubectl apply -f ~/.k8s/redirect-service.yml || exit 1

            # Inject the real image tag into each deployment manifest, then apply.
            sed -i "s|__IMAGE_UI__|${{ env.IMAGE_UI }}:${IMAGE_TAG}|g" ~/.k8s/ui-deployment.yml
            kubectl apply -f ~/.k8s/ui-deployment.yml || exit 1
            sed -i "s|__IMAGE_REDIRECT__|${{ env.IMAGE_REDIRECT }}:${IMAGE_TAG}|g" ~/.k8s/redirect-deployment.yml
            kubectl apply -f ~/.k8s/redirect-deployment.yml || exit 1

            # Explicit || exit 1 on both — under `set -e`, a failing command that's the first
            # half of an `&&` pair does NOT stop the script (only the last command in such a
            # list does), so a timed-out rollout here would otherwise print nothing, skip
            # straight past the `&&`'s "OK" echo, and let the job still report success — exactly
            # what happened before this was added: pods stuck crash-looping while CI stayed green.
            kubectl rollout status deployment/bl8-ui -n bl8 --timeout=120s && echo "bl8-ui rollout OK" || exit 1
            kubectl rollout status deployment/bl8-redirect -n bl8 --timeout=120s && echo "bl8-redirect rollout OK" || exit 1

            # Ingress last, same as the reference workflow — only makes sense to route traffic
            # once the Services/Deployments it points at already exist.
            kubectl apply -f ~/.k8s/ingress.yml || exit 1

            kubectl apply -f ~/.k8s/hpa.yml || exit 1
            kubectl apply -f ~/.k8s/pdb.yml || exit 1

            echo "Deployment completed successfully"
