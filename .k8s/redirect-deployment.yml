# __IMAGE_REDIRECT__ is templated by the deploy workflow into a real ghcr.io ref + tag before
# this is applied — see .github/workflows/deploy.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bl8-redirect
  namespace: bl8
  labels:
    app: bl8-redirect
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bl8-redirect
  template:
    metadata:
      labels:
        app: bl8-redirect
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bl8-redirect
          image: __IMAGE_REDIRECT__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bl8-redirect-config
            - secretRef:
                name: bl8-redirect-secrets
          # Same split as bl8-ui, same reason: GET /health (internal/handler/health.go) checks
          # Postgres/Redis, both external to this pod — that belongs in readiness (controls
          # whether traffic reaches this pod), never liveness (controls whether k8s kills and
          # restarts it, which does nothing to fix a dependency outage).
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
