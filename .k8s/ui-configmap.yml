# Non-secret runtime config for bl8-ui. Secrets (DATABASE_URL, REDIS_URL, AUTH_SECRET,
# GOOGLE_CLIENT_ID/SECRET, PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, SLACK_RECONCILE_WEBHOOK_URL) are created separately by the deploy
# workflow as a Secret named bl8-ui-secrets — see ui/README.md's "Environment variables" and
# ui/.env.example for the full list this splits across the two. This same Secret/ConfigMap pair
# is also mounted into the daily bl8-ui-reconcile CronJob (.k8s/ui-reconcile-cronjob.yml), not
# just the bl8-ui Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bl8-ui-config
  namespace: bl8
data:
  NODE_ENV: "production"
  PORT: "3000"
  # adapter-node needs this to build correct absolute URLs (redirects, form actions) when
  # running behind the ingress rather than accessed directly — see ui/vite.config.ts's adapter
  # setup (plain adapter(), no origin baked in at build time).
  ORIGIN: "https://bl8.us"
  # Where redirect/ is actually reachable — used to build short-link/QR-code URLs. Same host as
  # ORIGIN now (single-domain routing: bl8-ingress sends /app/* and exact / to this service,
  # everything else to bl8-redirect) — set explicitly rather than relying on the code's fallback.
  PUBLIC_REDIRECT_BASE_URL: "https://bl8.us"
  RATE_LIMIT_MAX: "20"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  STATUS_CHECK_INTERVAL_SECONDS: "60"
  PUBLIC_SEARCH_MIN_CHARS: "3"
  PUBLIC_SEARCH_DEBOUNCE_MS: "1000"
  # Free-plan active-link cap (ui/src/lib/server/planLimits.ts).
  FREE_PLAN_LINK_LIMIT: "25"
  # Active API-key cap per account (ui/src/lib/server/apiKeys.ts).
  API_KEY_LIMIT: "10"
  # Billing — Stripe is now the live provider (switched 2026-09-17); Paddle stays code-complete
  # and its webhook route keeps verifying/applying events regardless (see
  # $lib/server/billing/index.ts's own comment), so an existing Paddle subscriber isn't affected.
  BILLING_PROVIDER: "stripe"
  PADDLE_ENVIRONMENT: "sandbox"
  # Client-side Paddle checkout token — safe to expose (see ui/.env.example's own note).
  PUBLIC_PADDLE_CLIENT_TOKEN: "test_90c89af6bcdc7ec6a9b5f328656"
  PUBLIC_PADDLE_ENVIRONMENT: "sandbox"
  PUBLIC_PADDLE_PRO_PRICE_ID: "pri_01m2406tahap3kwc14e8vt5pn9"
  STRIPE_PRO_PRICE_ID: "price_1UH3RjKGpGol5PuFhuuR2TTr" # live; sandbox was "price_1UEAc6DwLk8HikBvayw9haOi"
