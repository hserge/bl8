# __IMAGE_UI__ is templated by the deploy workflow into a real ghcr.io ref + tag before this is
# applied — see .github/workflows/deploy.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bl8-ui
  namespace: bl8
  labels:
    app: bl8-ui
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bl8-ui
  template:
    metadata:
      labels:
        app: bl8-ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bl8-ui
          image: __IMAGE_UI__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bl8-ui-config
            - secretRef:
                name: bl8-ui-secrets
          # Liveness deliberately does NOT hit /health: that route (src/routes/health/+server.ts)
          # reports Postgres/Redis reachability, both external dependencies this pod doesn't
          # control — a liveness probe failing there would make k8s restart a perfectly healthy
          # ui pod during a database blip, which fixes nothing and just adds churn on top of a
          # real outage. A bare TCP check only asks "is the process still listening," which is
          # all liveness should ever ask.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          # Readiness is the right place for the dependency-aware check: pulling a pod that
          # can't reach its database out of the Service's endpoint list is exactly what
          # readiness is for.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
