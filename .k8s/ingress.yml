# ingress-nginx (this cluster's controller). TLS is issued and renewed automatically by
# cert-manager's existing `letsencrypt-prod` ClusterIssuer via HTTP-01 — the same proven pattern
# already used by this cluster's other ingresses (arevo-app-ingress, revo-app-ingress). No
# manual cert/key GitHub secrets: cert-manager creates and rotates the bl8-tls Secret on its own
# once this Ingress is applied. ssl-redirect is "false" and the server-snippet does the
# http->https redirect itself instead, carving out an exception for
# /.well-known/acme-challenge/ — the ACME HTTP-01 challenge must be reachable over plain HTTP,
# so a blanket ssl-redirect would break every renewal.
#
# Single host, matched by shape rather than an enumerated list of ui/ paths: redirect/'s codes
# are always exactly 7 alphanumeric characters (generateCode(), ui/src/lib/server/generateCode.ts
# — system-generated only, never user-chosen, so this is a real invariant, not a convention that
# could quietly drift), optionally followed by more path (/{code}/{slug}, /{code}/qr). Anything
# matching that shape goes to bl8-redirect; everything else — the landing page, /admin/*, Auth.js's
# /auth/*, ui/'s own /_app build-output and /images static assets, a future /pricing page nobody's
# written yet — goes to bl8-ui by default. This replaces an earlier version of this file that
# enumerated ui/'s reserved paths one by one (/admin, /auth, /_app, /images): that list had to be
# updated by hand every time ui/ gained a new top-level route, and silently 404'd anything missed.
# Matching redirect/'s fixed-shape codes instead needs no such upkeep.
#
# use-regex: "true" makes ingress-nginx treat pathType ImplementationSpecific paths as regex
# (nginx `location ~*`) instead of literal prefixes — required to express "exactly 7
# alphanumeric characters" at all, since plain Prefix/Exact can't. This applies to every path on
# this Ingress, including whatever cert-manager's http01-edit-in-place injects here during
# renewal — verified working by forcing a real renewal after this change shipped (see git log
# for the verification note), not just assumed safe from reading the docs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bl8-ingress
  namespace: bl8
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Auth.js's JWT session cookie (src/lib/server/auth.ts's session.strategy: 'jwt') gets large
    # enough right after a Google sign-in — sometimes chunked across multiple Set-Cookie headers
    # — that nginx's default 4k/8k proxy buffers overflow, failing with "upstream sent too big
    # header" (a real 502 seen in practice, immediately after the OAuth callback redirect).
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      set $redirect 0;
      if ($scheme = http) { set $redirect 1; }
      if ($request_uri ~ ^/.well-known/acme-challenge/) { set $redirect 0; }
      if ($redirect = 1) { return 308 https://$host$request_uri; }
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["bl8.us"]
      secretName: bl8-tls
  rules:
    - host: bl8.us
      http:
        paths:
          - path: /[a-zA-Z0-9]{7}(/.*)?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: bl8-redirect
                port:
                  number: 80
          - path: /.*
            pathType: ImplementationSpecific
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
