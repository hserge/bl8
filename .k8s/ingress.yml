# ingress-nginx (this cluster's controller). TLS is issued and renewed automatically by
# cert-manager's existing `letsencrypt-prod` ClusterIssuer via HTTP-01 — the same proven pattern
# already used by this cluster's other ingresses (arevo-app-ingress, revo-app-ingress). No
# manual cert/key GitHub secrets: cert-manager creates and rotates the bl8-tls Secret on its own
# once this Ingress is applied. ssl-redirect is "false" and the server-snippet does the
# http->https redirect itself instead, carving out an exception for
# /.well-known/acme-challenge/ — the ACME HTTP-01 challenge must be reachable over plain HTTP,
# so a blanket ssl-redirect would break every renewal.
#
# Single host, matched by shape rather than an enumerated list of ui/ paths: redirect/'s codes
# are always exactly 7 alphanumeric characters (generateCode(), ui/src/lib/server/generateCode.ts
# — system-generated only, never user-chosen, so this is a real invariant, not a convention that
# could quietly drift), optionally followed by more path (/{code}/{slug}, /{code}/qr). Anything
# matching that shape goes to bl8-redirect; everything else — the landing page, /admin/*, Auth.js's
# /auth/*, ui/'s own /_app build-output and /images static assets — goes to bl8-ui by default.
# This replaces an earlier version of this file that enumerated ui/'s reserved paths one by one
# (/admin, /auth, /_app, /images): that list had to be updated by hand every time ui/ gained a new
# top-level route, and silently 404'd anything missed. Matching redirect/'s fixed-shape codes
# instead needs no such upkeep — except for the one class of route name that shape can't tell
# apart from a real code: a ui/ route whose own first path segment happens to BE exactly 7
# alphanumeric characters. /pricing is exactly that (see the longer-than-the-code-matcher regex
# rule below, and its own comment for why); a future top-level ui/ route needs an entry added
# there too if it's also unlucky enough to be 7 chars.
#
# use-regex: "true" makes ingress-nginx treat pathType ImplementationSpecific paths as regex
# (nginx `location ~*`) instead of literal prefixes — required to express "exactly 7
# alphanumeric characters" at all, since plain Prefix/Exact can't. ingress-nginx sorts these by
# DESCENDING RAW STRING LENGTH before generating nginx's location blocks — not declaration order
# — so the code-matcher below deliberately stays shorter than nothing else needs to beat it, and
# the bl8-ui catch-all stays a plain `/.*` rather than growing a defensive exclusion for
# cert-manager's injected /.well-known/acme-challenge/<token> path: a real attempt at exactly
# that (a negative-lookahead exclusion) made the catch-all's string longer than the code-matcher,
# which made it sort FIRST and silently swallowed every real short code — a regression caught
# immediately by testing, not a hypothetical. Once understood, the original worry was unfounded
# anyway: cert-manager's injected path includes the actual ACME token (~70+ characters), which
# will in practice always be the longest string on this Ingress and sort ahead of both rules
# below automatically. That interaction is still unverified end-to-end, though — forcing a fresh
# certificate (deleting the Certificate and Secret) to test it came back inconclusive, since
# Let's Encrypt reused a still-valid cached authorization instead of running a fresh challenge, so
# no Challenge resource ever appeared to observe. The real renewal (~2026-11-07, this cert's
# renewalTime) is the first genuine end-to-end test; if it fails, revert this file to the
# prefix-based, non-regex version further back in git history as an immediate rollback.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bl8-ingress
  namespace: bl8
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Auth.js's JWT session cookie (src/lib/server/auth.ts's session.strategy: 'jwt') gets large
    # enough right after a Google sign-in — sometimes chunked across multiple Set-Cookie headers
    # — that nginx's default 4k/8k proxy buffers overflow, failing with "upstream sent too big
    # header" (a real 502 seen in practice, immediately after the OAuth callback redirect).
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      set $redirect 0;
      if ($scheme = http) { set $redirect 1; }
      if ($request_uri ~ ^/.well-known/acme-challenge/) { set $redirect 0; }
      if ($redirect = 1) { return 308 https://$host$request_uri; }
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["bl8.us"]
      secretName: bl8-tls
  rules:
    - host: bl8.us
      http:
        paths:
          # Known collision between a real ui/ route and the 7-char code shape below —
          # "pricing" is coincidentally exactly 7 letters, so /pricing and /pricing/success both
          # matched the redirect regex and 404'd at bl8-redirect instead of reaching bl8-ui
          # (caught 2026-09-10 by testing against the live deploy, not hypothetically).
          #
          # First attempt was a `pathType: Exact` rule here instead, reasoning that nginx's own
          # `location = <path>` always wins over a regex location unconditionally — that did NOT
          # work (still 404'd after deploying and confirming via `kubectl` that the Ingress had
          # actually updated), so `use-regex: "true"` above evidently applies uniformly to every
          # path on this Ingress regardless of declared pathType, not just ones marked
          # ImplementationSpecific — meaning Exact paths get swept into the very same
          # descending-string-length sort described below rather than bypassing it. Second
          # attempt used `^/pricing$|^/pricing/success$` as a regex instead — the Kubernetes API
          # itself rejected that outright ("must be an absolute path": every Ingress path,
          # regex or not, must start with a literal `/`, not `^` — the same lesson this repo hit
          # once before; see git history) — so the leading `^` had to go. Just dropping it
          # unwrapped would have been wrong anyway: `^` binds tighter than `|`, so
          # `^/pricing$|/pricing/success$` would only anchor the FIRST alternative, leaving
          # "/pricing/success$" free to match as an unanchored substring anywhere in a URI.
          # `(?:...)` below groups the alternation so the controller's own implicit start-anchor
          # (inferred, not confirmed — the leading-`/` requirement strongly implies one, but
          # this hasn't been isolated from the length-sort fix in testing) applies to the whole
          # group correctly either way. Kept deliberately longer as a raw string (29 chars) than
          # the code-matcher below (22 chars) so it sorts first regardless — the same proven
          # mechanism this file already relies on for the ACME-challenge case. A deliberate,
          # narrow exception to the shape-based approach below — for a known, specific collision,
          # not a return to enumerating every ui/ route — so add another entry here (also kept
          # longer than the code-matcher, starting with a literal `/`) only if a *future*
          # top-level ui/ route also happens to be exactly 7 characters.
          - path: /(?:pricing|pricing/success)$
            pathType: ImplementationSpecific
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
          - path: /[a-zA-Z0-9]{7}(/.*)?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: bl8-redirect
                port:
                  number: 80
          - path: /.*
            pathType: ImplementationSpecific
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
