# ingress-nginx (this cluster's controller). TLS is issued and renewed automatically by
# cert-manager's existing `letsencrypt-prod` ClusterIssuer via HTTP-01 — the same proven pattern
# already used by this cluster's other ingresses (arevo-app-ingress, revo-app-ingress). No
# manual cert/key GitHub secrets: cert-manager creates and rotates the bl8-tls Secret on its own
# once this Ingress is applied. ssl-redirect is "false" and the server-snippet does the
# http->https redirect itself instead, carving out an exception for
# /.well-known/acme-challenge/ — the ACME HTTP-01 challenge must be reachable over plain HTTP,
# so a blanket ssl-redirect would break every renewal.
#
# Single host, path-routed: bl8.us/admin/* and the bare bl8.us/ go to bl8-ui (the public landing
# page and, under /admin, the authenticated app — see ui/'s (protected)/admin route group).
# /auth/* also goes to bl8-ui — that's Auth.js's own routes (signin/callback/session/etc.),
# which @auth/sveltekit@1.11.3 hardcodes to its default /auth/* prefix regardless of any custom
# basePath config (see src/lib/server/auth.ts's comment); routing /auth here directly, rather
# than fighting the library, is simpler than it looks since these are framework-internal
# endpoints, not user-facing admin pages. /_app (SvelteKit's build output — every JS/CSS chunk
# the landing page's own HTML references) and /images (ui/static/images) also go to bl8-ui for
# the same reason the landing page's HTML itself does: only the *exact* "/" matches the
# bare-root rule below, so without these, every asset the landing page loads would otherwise
# fall through to the catch-all and 404 against bl8-redirect — which is exactly what happened
# before these were added (page loaded with zero CSS/JS). /robots.txt (ui/static/robots.txt) is
# NOT listed here on purpose — ingress-nginx's admission webhook rejects any path containing a
# dot regardless of pathType ("path /robots.txt cannot be used with pathType Exact/Prefix"), so
# it falls through to the bl8-redirect catch-all and 404s; a missing robots.txt is a standard,
# harmless default (crawlers treat it as "no restrictions"), not worth routing around the
# webhook for. Every other path (bl8.us/{code}) falls through to bl8-redirect. nginx-ingress
# evaluates an exact match and longer prefixes before a shorter prefix, so listing these ahead of
# the catch-all "/" prefix here is enough — no explicit priority annotation needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bl8-ingress
  namespace: bl8
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/server-snippet: |
      set $redirect 0;
      if ($scheme = http) { set $redirect 1; }
      if ($request_uri ~ ^/.well-known/acme-challenge/) { set $redirect 0; }
      if ($redirect = 1) { return 308 https://$host$request_uri; }
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["bl8.us"]
      secretName: bl8-tls
  rules:
    - host: bl8.us
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
          - path: /_app
            pathType: Prefix
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
          - path: /
            pathType: Exact
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bl8-redirect
                port:
                  number: 80
