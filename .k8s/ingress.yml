# ingress-nginx (this cluster's controller — matches the reference workflow's own arevo2
# manifests, not k3s's bundled Traefik). TLS secrets (bl8-ui-tls, bl8-redirect-tls) are created
# by the deploy workflow from base64 cert/key GitHub secrets, same as that reference — not
# cert-manager. If this cluster ever adds cert-manager, swap these tls: entries for a
# cert-manager.io/cluster-issuer annotation instead and drop the manual secret-creation step
# from the workflow.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bl8-ingress
  namespace: bl8
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: ["bl8.us"]
      secretName: bl8-redirect-tls
    - hosts: ["admin.bl8.us"]
      secretName: bl8-ui-tls
  rules:
    - host: bl8.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bl8-redirect
                port:
                  number: 80
    - host: admin.bl8.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bl8-ui
                port:
                  number: 80
